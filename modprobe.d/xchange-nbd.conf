# max_part decides whether the kernel scans partition tables, and like every nbd
# parameter it is fixed when the module loads. Without it you get /dev/nbd0 and
# nothing behind it, which looks like a corrupt disc rather than a missing
# option.
#
# nbds_max is deliberately absent. It decides how many /dev/nbdN nodes exist
# whether or not anything uses them, and the right number is not known until the
# SCSI bus has been scanned. xchange-nbd scans first and then loads the module
# with exactly as many nodes as it found devices, so setting a figure here would
# only pre-empt a better one.
options nbd max_part=16
